<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Knowledge</title>
  </head>
  <body class="inter">
    <header>
      <nav>
        <img
          class="nav-logo"
          src="./assets/logo-navbar.png"
          alt="Website logo"
        />
        <div class="nav-menu">
          <p>Features</p>
          <p>How It Works</p>
          <p>Why It's Different</p>
        </div>
        <button class="nav-button">Get Early Access</button>
      </nav>

      <section class="banner-section">
        <div class="banner-content">
          <div class="banner-first-element">
            <div class="circle1">
              <div class="circle2">
                <div class="circle3"></div>
              </div>
            </div>
            <p>Early Access Now Open</p>
          </div>
          <h1>
            <span class="heading-1">Structured thinking,</span><br /><span
              class="heading-2"
              >Not Just Note-Taking.</span
            >
          </h1>
          <p class="hero-para">
            A private space to store notes, links, and learning summaries —
            designed to <br />
            help you think clearly, connect ideas, and turn learning into
            long-term knowledge.
          </p>
          <div class="hero-btn">
            <button class="btn1">
              <p>Start Building Your Vault</p>
              <img src="./assets/ArrowRight.png" alt="right arrow" />
            </button>
            <button class="btn2">
              <i class="fa-solid fa-play"></i>See How It Works
            </button>
          </div>
        </div>
      </section>
    </header>
  </body>
</html>
